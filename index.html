<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chessMess</title>
  <meta name="description" content="Chess against the computer, the world's top grandmasters, or a friend online, with game review.">
  <meta name="theme-color" content="#07061a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="chessMess">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="aurora a"></div>
    <div class="aurora b"></div>
    <div class="aurora c"></div>
    <canvas id="bg"></canvas>
    <div id="floaters"></div>
  </div>

  <main>
    <h1><span class="logo">♞&#xFE0E;</span> chessMess</h1>

    <section id="menu" class="menu" aria-label="Menu">
      <nav class="menu-head" aria-label="Where you are">
        <button id="menu-back" type="button" class="menu-back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5L8.5 12l7 7"/></svg></button>
        <ol id="menu-path" class="menu-path"></ol>
      </nav>
      <h2 id="menu-title" class="menu-title"></h2>
      <p id="menu-hint" class="menu-hint"></p>
      <div id="menu-body" class="menu-body"></div>
    </section>

    <section id="play" class="play" aria-label="Game">
    <div class="game-bar">
      <button id="open-menu" type="button" class="menu-button">☰ Menu</button>
      <section class="score" aria-label="Score">
        <div><span class="score-label" id="score-me-label">You</span><span class="score-value" id="score-me">0</span></div>
        <div><span class="score-label">Draws</span><span class="score-value" id="score-draws">0</span></div>
        <div><span class="score-value" id="score-them">0</span><span class="score-label" id="score-them-label">Computer</span></div>
      </section>
    </div>

    <p id="status" class="status" role="status"></p>
    <p id="game-info" class="game-info" hidden></p>

    <div id="clock-top" class="clock" aria-label="Clock">
      <span class="clock-name"></span><span class="clock-time"></span>
    </div>

    <div class="board-row">
      <div id="eval-bar" class="eval-bar" aria-hidden="true">
        <div class="eval-white"></div>
        <span class="eval-text"></span>
      </div>

      <div id="board-wrap" class="board-wrap">
        <div class="board-border"></div>
        <div id="board" class="board"></div>
        <svg id="arrows" class="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
        <div id="promotion" class="overlay" hidden>
          <div class="overlay-card">
            <p>Promote to</p>
            <div id="promotion-choices" class="promotion-choices"></div>
          </div>
        </div>
        <div id="game-over" class="overlay" hidden>
          <div class="overlay-card">
            <h2 id="game-over-title"></h2>
            <p id="game-over-text"></p>
            <p id="game-over-rating" class="game-over-rating" hidden></p>
            <div class="overlay-actions">
              <button id="play-again" type="button" class="primary">Play again</button>
              <button id="review-game" type="button">Review game</button>
              <button id="game-over-menu" type="button">Menu</button>
            </div>
            <button id="view-board" type="button" class="link-button">View the board</button>
          </div>
        </div>
        <div id="draft" class="overlay" hidden>
          <div class="overlay-card draft-card">
            <p id="draft-round" class="draft-round"></p>
            <h2 id="draft-title"></h2>
            <div id="draft-choices" class="draft-choices"></div>
            <div id="draft-timer" class="draft-timer"><div></div></div>
          </div>
        </div>
        <ul id="chaos-log" class="chaos-log" aria-live="polite"></ul>
      </div>
    </div>

    <div id="clock-bottom" class="clock" aria-label="Clock">
      <span class="clock-name"></span><span class="clock-time"></span>
    </div>

    <section id="setup" class="setup" aria-label="Set up a position" hidden>
      <p class="setup-help">Pick a piece, then click squares on the board to put it there. Clicking a square again with the same piece, or with the eraser, clears it.</p>
      <div id="setup-palette" class="setup-palette" role="radiogroup" aria-label="Piece to place"></div>
      <div class="setup-row">
        <label>To move
          <select id="setup-turn">
            <option value="w">White</option>
            <option value="b">Black</option>
          </select>
        </label>
        <button id="setup-standard" type="button">Starting position</button>
        <button id="setup-clear" type="button">Clear board</button>
      </div>
      <p id="setup-error" class="setup-error" role="alert"></p>
      <div class="setup-row">
        <button id="setup-play" type="button" class="primary">Play this position</button>
        <button id="setup-cancel" type="button">Cancel</button>
      </div>
    </section>

    <section id="review" class="review" aria-label="Game review" hidden>
      <header class="review-head">
        <div>
          <h2>Game review</h2>
          <p id="review-result" class="review-result"></p>
        </div>
        <button id="review-close" type="button">Back to game</button>
      </header>
      <div id="review-progress" class="review-progress">
        <div class="review-progress-bar"></div>
        <span></span>
      </div>
      <table class="review-summary">
        <thead><tr><th></th><th id="review-first-side"></th><th id="review-second-side"></th></tr></thead>
        <tbody id="review-summary"></tbody>
      </table>
      <div id="review-graph" class="review-graph" title="Click to jump to a move"></div>
      <p id="review-comment" class="review-comment" aria-live="polite"></p>
      <ol id="review-moves" class="review-moves"></ol>
      <div class="review-nav">
        <button type="button" data-step="first" aria-label="First move">⏮&#xFE0E;</button>
        <button type="button" data-step="prev" aria-label="Previous move">◀&#xFE0E;</button>
        <button type="button" data-step="next" aria-label="Next move">▶&#xFE0E;</button>
        <button type="button" data-step="last" aria-label="Last move">⏭&#xFE0E;</button>
      </div>
    </section>

    <section id="online" class="online" aria-label="Online game" aria-live="polite" hidden>
      <p id="online-text" class="online-text"></p>
      <div id="online-actions" class="online-actions"></div>
    </section>

    <section id="chat" class="chat" aria-label="Chat" hidden>
      <ol id="chat-log" class="chat-log" aria-live="polite"></ol>
      <div id="emotes" class="emotes"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" maxlength="200" placeholder="Say something…" autocomplete="off" aria-label="Chat message">
        <button type="submit">Send</button>
      </form>
    </section>

    <section class="actions" aria-label="Game actions">
      <button id="undo" type="button" aria-label="Undo move" title="Undo">↶&#xFE0E; Undo</button>
      <button id="redo" type="button" aria-label="Redo move" title="Redo">Redo ↷&#xFE0E;</button>
      <button id="edit-position" type="button">Edit position</button>
      <button id="resign" type="button">Resign</button>
      <button id="new-game" type="button" class="primary">New game</button>
    </section>
    </section>
  </main>

  <canvas id="fx" aria-hidden="true"></canvas>

  <script src="engine.js"></script>
  <script src="fx.js"></script>
  <script src="chaos.js"></script>
  <script src="grandmasters.js"></script>
  <script src="review.js"></script>
  <script src="online.js"></script>
  <script src="pwa.js"></script>
  <script src="app.js"></script>
</body>
</html>
