<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chessMess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="aurora a"></div>
    <div class="aurora b"></div>
    <div class="aurora c"></div>
    <canvas id="bg"></canvas>
    <div id="floaters"></div>
  </div>

  <main>
    <h1><span class="logo">♞&#xFE0E;</span> chessMess</h1>

    <section class="score" aria-label="Score">
      <div><span class="score-value" id="score-player">0</span><span class="score-label">You</span></div>
      <div><span class="score-value" id="score-draws">0</span><span class="score-label">Draws</span></div>
      <div><span class="score-value" id="score-computer">0</span><span class="score-label">Computer</span></div>
    </section>

    <p id="status" class="status" role="status"></p>

    <div id="board-wrap" class="board-wrap">
      <div class="board-border"></div>
      <div id="board" class="board"></div>
      <div id="promotion" class="overlay" hidden>
        <div class="overlay-card">
          <p>Promote to</p>
          <div id="promotion-choices" class="promotion-choices"></div>
        </div>
      </div>
      <div id="game-over" class="overlay" hidden>
        <div class="overlay-card">
          <h2 id="game-over-title"></h2>
          <p id="game-over-text"></p>
          <div class="overlay-actions">
            <button id="play-again" type="button" class="primary">Play again</button>
            <button id="view-board" type="button">View board</button>
          </div>
        </div>
      </div>
    </div>

    <section class="controls">
      <label>Difficulty
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <label>Play as
        <select id="side">
          <option value="white">White</option>
          <option value="black">Black</option>
        </select>
      </label>
      <button id="new-game" type="button" class="primary">New game</button>
      <button id="resign" type="button">Resign</button>
      <button id="reset-score" type="button" class="quiet">Reset score</button>
    </section>
  </main>

  <canvas id="fx" aria-hidden="true"></canvas>

  <script src="engine.js"></script>
  <script src="fx.js"></script>
  <script src="app.js"></script>
</body>
</html>
